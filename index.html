<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ledger — тренажёр английских фраз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A38;
    --ink-soft:#4B5768;
    --paper:#F3F1E7;
    --card:#FFFEFA;
    --line:#D9D3BF;
    --line-strong:#B9B199;
    --teal:#2E6B5E;
    --teal-soft:#E4EEEA;
    --gold:#A9782F;
    --gold-soft:#F2E8D3;
    --rust:#9C4632;
    --rust-soft:#F3E1DB;
    --plum:#5B4B6E;
    --plum-soft:#EAE4EF;
    --sky:#35607A;
    --sky-soft:#DCE7ED;
    --rose:#96435E;
    --rose-soft:#F2DEE4;
    --radius:10px;
    --shadow:0 1px 0 var(--line-strong);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 27px,
        var(--line) 28px
      ),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:20px 18px 48px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
    margin-bottom:18px;
  }
  header.top h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .tally-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .tally{
    flex:1;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:10px 12px;
    text-align:center;
  }
  .tally b{
    display:block;
    font-family:'Source Serif 4', serif;
    font-size:1.5rem;
    line-height:1.1;
  }
  .tally span{
    font-size:0.68rem;
    color:var(--ink-soft);
  }
  nav.modes{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
    margin-bottom:14px;
  }
  nav.modes button{
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:10px 2px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.8rem;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    min-width:0;
  }
  nav.modes button.active{
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    border-color:var(--ink);
  }
  .panel{
    background:var(--card);
    border:1px solid var(--ink);
    border-radius:8px;
    padding:16px;
    min-height:320px;
  }
  .banner{
    background:var(--gold-soft);
    border:1px solid var(--gold);
    color:var(--ink);
    border-radius:8px;
    padding:10px 12px;
    font-size:0.78rem;
    line-height:1.4;
    margin-bottom:14px;
  }
  .banner b{font-weight:600;}
  /* sentence builder */
  .answer-zone{
    min-height:58px;
    border:1px dashed var(--line-strong);
    border-radius:8px;
    padding:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-content:flex-start;
    margin:4px 0 12px;
    background:var(--paper);
  }
  .token-pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .chip{
    border:1px solid var(--line-strong);
    background:var(--card);
    border-radius:8px;
    padding:8px 11px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.92rem;
    color:var(--ink);
    cursor:pointer;
  }
  .chip.used{visibility:hidden;}
  .chip.placed{background:var(--teal-soft);border-color:var(--teal);}
  .btn-row{display:flex;gap:8px;}
  .btn-row button, .btn-solid, .btn-ghost{
    flex:1;
    padding:11px 8px;
    border-radius:8px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  .btn-solid{border:1px solid var(--ink);background:var(--ink);color:var(--paper);}
  .btn-ghost{border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);}
  .btn-solid:disabled{opacity:0.4;cursor:default;}
  .listen-btn{
    display:block;
    margin:6px auto 4px;
    width:84px;height:84px;
    border-radius:999px;
    border:1px solid var(--ink);
    background:var(--paper);
    font-size:2rem;
    cursor:pointer;
  }
  .listen-slow{
    display:block;
    margin:0 auto 16px;
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    font-size:0.78rem;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
  }
  /* days / progress */
  .sec-title{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:1.05rem;
    margin:0 0 10px;
  }
  .day-row{
    display:grid;
    grid-template-columns:70px 1fr;
    gap:8px;
    align-items:center;
    padding:6px 0;
    border-bottom:1px solid var(--line);
    font-size:0.78rem;
  }
  .day-row .bar-wrap{background:var(--paper);border-radius:4px;height:16px;position:relative;}
  .day-row .bar{background:var(--teal);height:16px;border-radius:4px;min-width:2px;}
  .day-row .meta{grid-column:2;color:var(--ink-soft);font-size:0.72rem;margin-top:-2px;}
  .cat-prog{margin-bottom:10px;font-size:0.8rem;}
  .cat-prog .line{display:flex;justify-content:space-between;margin-bottom:3px;}
  .cat-prog .track{background:var(--paper);height:10px;border-radius:5px;overflow:hidden;position:relative;}
  .cat-prog .seen{position:absolute;left:0;top:0;bottom:0;background:var(--line-strong);}
  .cat-prog .mast{position:absolute;left:0;top:0;bottom:0;background:var(--teal);}
  textarea.code{
    width:100%;
    min-height:70px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    font-family:monospace;
    font-size:0.7rem;
    padding:8px;
    resize:vertical;
  }
  .note{font-size:0.74rem;color:var(--ink-soft);line-height:1.4;margin:6px 0 10px;}
  .cats{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:16px;
  }
  .cats button{
    border:1px solid var(--line-strong);
    background:var(--paper);
    border-radius:999px;
    padding:5px 11px;
    font-size:0.72rem;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cats button.on{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .session-tally{
    display:flex;
    gap:4px;
    align-items:center;
    margin-bottom:14px;
    font-size:0.72rem;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .hatch{
    display:inline-block;
    width:9px;
    height:16px;
    border-left:2px solid var(--line-strong);
    margin-right:2px;
  }
  .hatch.done{border-color:var(--teal);}
  .hatch.cur{border-color:var(--ink);}
  /* FLASHCARD */
  .fcard{
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:26px 20px 20px;
    text-align:center;
    cursor:pointer;
    min-height:210px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
  }
  .fcard .tag{
    position:absolute;
    top:10px;
    left:12px;
    font-size:0.66rem;
    padding:2px 8px;
    border-radius:999px;
  }
  .fcard .front-word{
    font-family:'Source Serif 4', serif;
    font-size:1.55rem;
    font-weight:600;
    border-bottom:1px solid var(--line-strong);
    display:inline-block;
    padding-bottom:10px;
    margin:0 auto 6px;
  }
  .fcard .example{
    font-family:'Source Serif 4', serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.9rem;
    margin-top:10px;
    line-height:1.4;
  }
  .fcard .back{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line-strong);
  }
  .fcard .back .ru{
    font-size:1.2rem;
    font-weight:600;
    color:var(--teal);
  }
  .fcard .hint{
    font-size:0.68rem;
    color:var(--ink-soft);
    margin-top:16px;
  }
  .spk{
    border:1px solid var(--line-strong);
    background:var(--paper);
    border-radius:999px;
    width:30px;height:30px;
    font-size:0.85rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;justify-content:center;
    margin-left:8px;
    vertical-align:middle;
  }
  .grade-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .grade-row button{
    flex:1;
    padding:12px 6px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  .grade-row .no{background:var(--rust-soft);color:var(--rust);border-color:var(--rust);}
  .grade-row .yes{background:var(--teal-soft);color:var(--teal);border-color:var(--teal);}
  /* QUIZ / TYPE */
  .q-prompt{
    text-align:center;
    padding:14px 6px 20px;
  }
  .q-prompt .lbl{font-size:0.7rem;color:var(--ink-soft);margin-bottom:8px;}
  .q-prompt .word{
    font-family:'Source Serif 4', serif;
    font-size:1.5rem;
    font-weight:600;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    text-align:left;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.92rem;
    cursor:pointer;
  }
  .opt.correct{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .opt.wrong{background:var(--rust-soft);border-color:var(--rust);color:var(--rust);}
  .type-row{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .type-row input{
    flex:1;
    min-width:0;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    font-size:0.95rem;
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .type-row input:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .type-row button{
    padding:0 18px;
    border-radius:8px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    cursor:pointer;
  }
  .feedback{
    margin-top:14px;
    padding:12px 14px;
    border-radius:8px;
    font-size:0.88rem;
    line-height:1.45;
  }
  .feedback.ok{background:var(--teal-soft);color:var(--teal);}
  .feedback.bad{background:var(--rust-soft);color:var(--rust);}
  .feedback .ex{display:block;margin-top:6px;font-style:italic;color:var(--ink-soft);}
  .next-btn{
    margin-top:14px;
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .empty-state{
    text-align:center;
    padding:40px 10px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:'Source Serif 4', serif;
    font-size:1.3rem;
    color:var(--ink);
    margin-bottom:6px;
  }
  .browse-list{max-height:420px;overflow-y:auto;}
  .browse-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:baseline;
  }
  .browse-item .en{font-weight:600;}
  .browse-item .ru{color:var(--ink-soft);font-size:0.85rem;text-align:right;}
  footer.foot{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.7rem;
    color:var(--ink-soft);
  }
  footer.foot button{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;font-size:0.7rem;
    font-family:'IBM Plex Sans', sans-serif;
    padding:0;
  }
  .cat-business{background:var(--teal-soft);color:var(--teal);}
  .cat-everyday{background:var(--gold-soft);color:var(--gold);}
  .cat-tech{background:var(--sky-soft);color:var(--sky);}
  .cat-women{background:var(--rose-soft);color:var(--rose);}
  .cat-phrases{background:var(--plum-soft);color:var(--plum);}
  @media (prefers-reduced-motion:no-preference){
    .fcard{transition:transform .15s ease;}
    .opt{transition:background .12s ease;}
  }
  @media (max-width:380px){
    header.top h1{font-size:1.3rem;}
    .fcard .front-word{font-size:1.3rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Ledger</h1>
      <div class="sub">Английский для жизни, ИИ и работы</div>
    </div>
  </header>

  <div id="storageBanner"></div>

  <div class="tally-row" id="tallyRow"></div>

  <nav class="modes" id="modeNav">
    <button data-mode="flash" class="active">Карточки</button>
    <button data-mode="quiz">Тест</button>
    <button data-mode="type">Ввод</button>
    <button data-mode="build">Сборка</button>
    <button data-mode="listen">Слух</button>
    <button data-mode="days">Дни</button>
    <button data-mode="browse">Список</button>
  </nav>

  <div class="panel" id="panel">
    <!-- rendered by JS -->
  </div>

  <footer class="foot">
    <span id="footNote">Прогресс сохраняется автоматически</span>
    <button id="resetBtn">Сбросить прогресс</button>
  </footer>

</div>

    // Устойчивые фразы, клише и идиомы
    {id:'f1',cat:'phrases',en:"How's it going?",ru:"Как дела?",ex:"Hi, Tom! How's it going?",exRu:"Привет, Том! Как дела?"},
    {id:'f2',cat:'phrases',en:"No worries",ru:"Не переживай, без проблем",ex:"Sorry I'm late! No worries, we have just started.",exRu:"Извини, что опоздала! Не переживай, мы только начали."},
    {id:'f3',cat:'phrases',en:"Fair enough",ru:"Справедливо, ладно, согласна",ex:"You want to check it first? Fair enough.",exRu:"Ты хочешь сначала это проверить? Ладно, справедливо."},
    {id:'f4',cat:'phrases',en:"Take your time",ru:"Не торопись",ex:"Take your time, there is no rush.",exRu:"Не торопись, спешить некуда."},
    {id:'f5',cat:'phrases',en:"Long story short",ru:"Короче говоря",ex:"Long story short, we missed the flight.",exRu:"Короче говоря, мы опоздали на рейс."},
    {id:'f6',cat:'phrases',en:"By the way",ru:"Кстати",ex:"By the way, did you get my email?",exRu:"Кстати, вы получили моё письмо?"},
    {id:'f7',cat:'phrases',en:"Speaking of which",ru:"Кстати, раз уж речь об этом",ex:"Speaking of which, have you finished the report?",exRu:"Кстати, раз уж речь об этом, вы закончили отчёт?"},
    {id:'f8',cat:'phrases',en:"Never mind",ru:"Не бери в голову, забудь",ex:"I can't find my keys... oh, never mind, here they are.",exRu:"Не могу найти ключи… ой, неважно, вот они."},
    {id:'f9',cat:'phrases',en:"It's up to you",ru:"Тебе решать",ex:"We can go either way. It's up to you.",exRu:"Мы можем поступить так или иначе. Тебе решать."},

    {id:'f11',cat:'phrases',en:"Let me think about it",ru:"Дайте мне подумать",ex:"Let me think about it and I'll let you know tomorrow.",exRu:"Дайте мне подумать, и я сообщу вам завтра."},

    {id:'f16',cat:'phrases',en:"Keep in touch",ru:"Оставайтесь на связи",ex:"It was great to see you. Let's keep in touch!",exRu:"Было здорово тебя повидать. Давай оставаться на связи!"},

    {id:'f20',cat:'phrases',en:"I'm on my way",ru:"Я уже в пути",ex:"I'm on my way, see you in ten minutes.",exRu:"Я уже в пути, увидимся через десять минут."},
    {id:'f21',cat:'phrases',en:"Sorry for the delay",ru:"Извините за задержку",ex:"Sorry for the delay in replying.",exRu:"Извините за задержку с ответом."},
    {id:'f22',cat:'phrases',en:"Hang in there",ru:"Держись",ex:"I know it's hard right now, but hang in there.",exRu:"Я знаю, сейчас тяжело, но держись."},

    {id:'w9',cat:'women',en:'self-care',ru:'забота о себе',ex:"Self-care isn't selfish, it's necessary.",exRu:'Забота о себе — это не эгоизм, а необходимость.'},
    {id:'w10',cat:'women',en:'maternity leave',ru:'декретный отпуск',ex:"She's currently on maternity leave.",exRu:'Сейчас она находится в декретном отпуске.'}
  ];

  var CATS = {
    everyday:{label:'Бытовые', cls:'cat-everyday'},
    tech:{label:'ИИ и код', cls:'cat-tech'},
    phrases:{label:'Фразы и клише', cls:'cat-phrases'},
    business:{label:'Бухгалтерия', cls:'cat-business'},
    women:{label:'Женские темы', cls:'cat-women'}
  };

  var BOX_MS = [0, 10*60*1000, 8*60*60*1000, 24*60*60*1000, 3*24*60*60*1000, 7*24*60*60*1000, 16*24*60*60*1000, 35*24*60*60*1000];
  var MASTER_BOX = 6;
  var NEW_PER_DAY = 8;
  var SESSION_SIZE = 12;

  // The order in which NEW words are introduced: a repeating pattern that mixes the
  // categories (3 everyday : 2 AI/code : 2 phrases : 1 accounting : 1 women's topics),
  // so a day never starts with a pile of accounting terms.
  var INTRO_PATTERN = ['everyday','tech','phrases','everyday','tech','phrases','business','women','everyday'];

  function interleaveDeck(raw){
    var lists = {};
    raw.forEach(function(d){ (lists[d.cat] = lists[d.cat] || []).push(d); });
    var out = [], left = raw.length, i = 0, guard = 0;
    while (left > 0 && guard < 100000){
      var list = lists[INTRO_PATTERN[i % INTRO_PATTERN.length]];
      i++; guard++;
      if (list && list.length){ out.push(list.shift()); left--; }
    }
    return out;
  }

  var DECK = interleaveDeck(DECK_RAW);   // scheduling order (mixed)
  var DECK_BY_ID = {};
  DECK.forEach(function(d){ DECK_BY_ID[d.id] = d; });

  /* ---------------- STORAGE ----------------
     Three layers, tried in order, so the same file works both inside Claude
     and as a plain HTML file opened anywhere:
       1) window.storage  - Claude's cloud storage (only present in a
          published Claude artifact). Syncs to the logged-in account.
       2) localStorage    - the browser's own storage. Works when this file
          is opened directly (double-clicked, hosted on a plain web server,
          emailed, etc.) with no Claude account involved. Saves per device
          / per browser, not synced anywhere.
       3) in-memory       - last resort if both are blocked (e.g. private
          browsing mode); progress is lost on reload.
  ---------------------------------------------- */
  var mem = null;
  var STORAGE_KEY = 'ledger-progress-v1';

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }

  function defaultProgress(){
    return { cards:{}, today: freshToday(), streak:{count:0, lastDate:null}, history:{} };
  }

  // Per-day activity log for the "Дни" tab: repetitions, correct answers, new words.
  function historyFor(day){
    if (!PROGRESS.history) PROGRESS.history = {};
    if (!PROGRESS.history[day]) PROGRESS.history[day] = {reps:0, correct:0, newWords:0};
    return PROGRESS.history[day];
  }

  function lsGet(){
    try{
      if (typeof localStorage === 'undefined') return null;
      return localStorage.getItem(STORAGE_KEY);
    }catch(e){ return null; }
  }
  function lsSet(str){
    try{
      if (typeof localStorage === 'undefined') return false;
      localStorage.setItem(STORAGE_KEY, str);
      return true;
    }catch(e){ return false; }
  }

  // Can progress actually be saved here? Inside some preview windows and in private
  // browsing both storages are blocked and progress would silently vanish between days.
  function storageWorks(){
    if (window.storage && typeof window.storage.set === 'function') return true;
    try{
      if (typeof localStorage === 'undefined') return false;
      var k = STORAGE_KEY + '-probe';
      localStorage.setItem(k, '1');
      var ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      return ok;
    }catch(e){ return false; }
  }

  function renderBanner(){
    var el = document.getElementById('storageBanner');
    if (!el) return;
    if (storageWorks()){ el.innerHTML = ''; return; }
    el.innerHTML = '<div class="banner"><b>Прогресс в этом окне не сохраняется.</b> '+
      'Так бывает в предпросмотре или в приватной вкладке. Откройте файл в обычном браузере '+
      '(Chrome, Safari) или на вкладке «Дни» скопируйте код прогресса и вставьте его при следующем запуске.</div>';
  }

  function loadProgress(){
    return new Promise(function(resolve){
      function fromLocalOrMem(){
        var raw = lsGet();
        if (raw){
          try{ resolve(JSON.parse(raw)); return; }catch(e){}
        }
        mem = mem || defaultProgress();
        resolve(mem);
      }
      if (window.storage && typeof window.storage.get === 'function'){
        window.storage.get(STORAGE_KEY, false).then(function(res){
          if (res && res.value){
            try{ resolve(JSON.parse(res.value)); return; }catch(e){}
          }
          resolve(defaultProgress());
        }).catch(fromLocalOrMem);
        return;
      }
      fromLocalOrMem();
    });
  }

  function saveProgress(p){
    var json = JSON.stringify(p);
    if (window.storage && typeof window.storage.set === 'function'){
      return window.storage.set(STORAGE_KEY, json, false).catch(function(){
        if (!lsSet(json)) mem = p;
      });
    }
    if (!lsSet(json)) mem = p;
    return Promise.resolve();
  }

  var PROGRESS = null;

  function ensureCardState(id){
    if (!PROGRESS.cards[id]){
      PROGRESS.cards[id] = {box:0, next:0, seen:0, correct:0, lastBoxDate:null};
    }
    return PROGRESS.cards[id];
  }

  function isMastered(id){
    return ensureCardState(id).box >= MASTER_BOX;
  }

  // "today" tracks which words were introduced today (shared across tabs, capped
  // at NEW_PER_DAY) and which of those/reviews were already done in EACH tab today
  // (so switching tabs doesn't just re-show or hide the same words).
  // "dueAtStart" is the review list for the day: every word whose repetition was due
  // when the day began. Each exercise tab can work through it once, even after another
  // tab has already moved those words forward in the schedule.
  function freshToday(cards){
    var due = [];
    if (cards){
      var now = Date.now();
      Object.keys(cards).forEach(function(id){
        var s = cards[id];
        if (s && s.seen > 0 && s.next <= now) due.push(id);
      });
    }
    return { date: todayStr(), introduced: [], dueAtStart: due,
             doneByMode: {flash:[], quiz:[], type:[], build:[], listen:[]} };
  }
  function resetTodayIfNeeded(){
    if (!PROGRESS.today || PROGRESS.today.date !== todayStr()){
      PROGRESS.today = freshToday(PROGRESS.cards);
    }
  }

  function bumpStreakOnActivity(){
    var today = todayStr();
    if (PROGRESS.streak.lastDate === today) return;
    var last = PROGRESS.streak.lastDate;
    if (last){
      var lastDate = new Date(last.replace(/-/g,'/'));
      var diffDays = Math.round((new Date(today.replace(/-/g,'/')) - lastDate) / 86400000);
      PROGRESS.streak.count = (diffDays === 1) ? PROGRESS.streak.count + 1 : 1;
    } else {
      PROGRESS.streak.count = 1;
    }
    PROGRESS.streak.lastDate = today;
  }

  function grade(id, correct, mode){
    resetTodayIfNeeded();
    var s = ensureCardState(id);
    var now = Date.now();
    var wasNew = (s.seen === 0);
    if (wasNew && PROGRESS.today.introduced.indexOf(id) === -1){
      PROGRESS.today.introduced.push(id);
    }
    s.seen += 1;
    if (correct) s.correct += 1;
    // The spaced-repetition schedule only moves once per calendar day, even if
    // the same word gets practiced in several tabs today - otherwise a word
    // could jump several boxes in one sitting just from being drilled 3 ways.
    if (s.lastBoxDate !== todayStr()){
      if (correct){
        s.box = Math.min(s.box + 1, BOX_MS.length - 1);
        s.next = now + BOX_MS[s.box];
      } else {
        s.box = 0;
        s.next = now + BOX_MS[1];
      }
      s.lastBoxDate = todayStr();
    }
    if (!PROGRESS.today.doneByMode[mode]) PROGRESS.today.doneByMode[mode] = [];
    var doneList = PROGRESS.today.doneByMode[mode];
    if (doneList.indexOf(id) === -1) doneList.push(id);
    var h = historyFor(todayStr());
    h.reps += 1;
    if (correct) h.correct += 1;
    if (wasNew) h.newWords += 1;
    bumpStreakOnActivity();
    saveProgress(PROGRESS);
  }

  /* ---------------- STATE ---------------- */
  var state = {
    mode:'flash',
    activeCats:['everyday','tech','phrases','business','women'],
    queue:[],
    idx:0,
    flipped:false,
    quizAnswered:false,
    typeChecked:false
  };

  function filteredDeck(){
    return DECK.filter(function(d){ return state.activeCats.indexOf(d.cat) > -1; });
  }

  // Cards reachable in a given tab today: reviews due from earlier days (not yet
  // redone in THIS tab today) + today's new-word batch, shared by all three tabs
  // but tracked separately per tab so each can be worked through once on its own.
  function reachableFor(mode){
    resetTodayIfNeeded();
    var now = Date.now();
    var pool = filteredDeck();
    var doneInMode = PROGRESS.today.doneByMode[mode] || [];
    var introducedToday = PROGRESS.today.introduced;

    // Words introduced today live in the "today's batch" list below, so they must
    // not also be counted as due reviews (that double-counted them 10 minutes later).
    var dueAtStart = PROGRESS.today.dueAtStart || [];
    var reviewDue = pool.filter(function(d){
      var s = ensureCardState(d.id);
      return s.seen > 0 && doneInMode.indexOf(d.id) === -1 &&
             introducedToday.indexOf(d.id) === -1 &&
             (s.next <= now || dueAtStart.indexOf(d.id) > -1);
    });
    var todaysBatchPending = pool.filter(function(d){
      return introducedToday.indexOf(d.id) > -1 && doneInMode.indexOf(d.id) === -1;
    });
    var remainingNewSlots = Math.max(0, NEW_PER_DAY - introducedToday.length);
    var freshNew = pool.filter(function(d){
      return ensureCardState(d.id).seen === 0 && introducedToday.indexOf(d.id) === -1;
    }).slice(0, remainingNewSlots);

    return {reviewDue:reviewDue, newDue:todaysBatchPending.concat(freshNew)};
  }

  // Exercise tabs each have their own daily set; "days" and "browse" are just views.
  var EXERCISES = ['flash','quiz','type','build','listen'];

  function buildQueue(){
    if (EXERCISES.indexOf(state.mode) === -1){ state.queue = []; state.idx = 0; return; }
    var r = reachableFor(state.mode);
    var combined = r.reviewDue.concat(r.newDue);
    combined = shuffle(combined).slice(0, SESSION_SIZE);
    state.queue = combined;
    state.idx = 0;
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function currentCard(){
    return state.queue[state.idx];
  }

  function advance(){
    state.idx += 1;
    state.flipped = false;
    state.quizAnswered = false;
    state.typeChecked = false;
    render();
  }

  /* ---------------- SPEECH ---------------- */
  function speak(text, rate){
    if (!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate || 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------------- RENDER: TOP TALLIES ---------------- */
  function renderTallies(){
    var pool = filteredDeck();
    var modeForCount = (EXERCISES.indexOf(state.mode) === -1) ? 'flash' : state.mode;
    var r = reachableFor(modeForCount);
    var dueCount = r.reviewDue.length + r.newDue.length;
    var masteredCount = pool.filter(function(d){ return isMastered(d.id); }).length;
    var streak = PROGRESS.streak.lastDate === todayStr() || isDateYesterday(PROGRESS.streak.lastDate) ? PROGRESS.streak.count : 0;
    var el = document.getElementById('tallyRow');
    el.innerHTML =
      '<div class="tally"><b>'+dueCount+'</b><span>доступно сегодня</span></div>'+
      '<div class="tally"><b>'+masteredCount+'</b><span>усвоено из '+pool.length+'</span></div>'+
      '<div class="tally"><b>'+streak+'</b><span>'+plural(streak, ['день подряд','дня подряд','дней подряд'])+'</span></div>';
  }

  // Russian plural: 1 день, 2-4 дня, 5+ дней (11-14 are always the "many" form).
  function plural(n, forms){
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return forms[0];
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
    return forms[2];
  }

  function isDateYesterday(dateStr){
    if (!dateStr) return false;
    var d = new Date(dateStr.replace(/-/g,'/'));
    var diff = Math.round((new Date(todayStr().replace(/-/g,'/')) - d) / 86400000);
    return diff <= 1;
  }

  /* ---------------- RENDER: CATEGORY FILTER ---------------- */
  function renderCatPicker(container){
    var html = '<div class="cats">';
    Object.keys(CATS).forEach(function(key){
      var on = state.activeCats.indexOf(key) > -1;
      html += '<button data-cat="'+key+'" class="'+(on?'on':'')+'">'+CATS[key].label+'</button>';
    });
    html += '</div>';
    container.innerHTML += html;
  }

  function renderSessionTally(container){
    if (!state.queue.length) return;
    var html = '<div class="session-tally">Сессия: ';
    for (var i=0;i<state.queue.length;i++){
      var cls = i < state.idx ? 'done' : (i === state.idx ? 'cur' : '');
      html += '<span class="hatch '+cls+'"></span>';
    }
    html += ' &nbsp;'+Math.min(state.idx+1, state.queue.length)+' / '+state.queue.length+'</div>';
    container.innerHTML += html;
  }

  /* ---------------- RENDER: EMPTY STATE ---------------- */
  var MODE_LABELS = {flash:'«Карточки»', quiz:'«Тест»', type:'«Ввод»', build:'«Сборка»', listen:'«Слух»'};
  function emptyStateHtml(){
    var others = EXERCISES.filter(function(m){ return m !== state.mode; });
    var hint = others.map(function(m){ return MODE_LABELS[m]; }).join(', ');
    return '<div class="empty-state"><div class="big">На сегодня в этой вкладке всё!</div>'+
      'Эти же слова можно ещё потренировать в других упражнениях: '+hint+'. У каждого свой набор на сегодня. '+
      'Слова на повторение появятся, когда подойдёт их срок.</div>';
  }

  // Shown when the current session queue is finished. If more words are still
  // available today (the session holds at most SESSION_SIZE), offer to continue
  // instead of claiming everything is done.
  function showEmpty(panel){
    var r = reachableFor(state.mode);
    var avail = r.reviewDue.length + r.newDue.length;
    if (avail > 0){
      panel.innerHTML += '<div class="empty-state"><div class="big">Сессия пройдена</div>'+
        'В этой вкладке на сегодня есть ещё слова: '+avail+'.</div>'+
        '<button class="btn-solid" id="moreBtn" style="width:100%">Продолжить</button>';
      document.getElementById('moreBtn').addEventListener('click', function(){
        buildQueue();
        render();
      });
      return;
    }
    panel.innerHTML += emptyStateHtml();
  }

  /* ---------------- RENDER: FLASHCARDS ---------------- */
  function renderFlash(panel){
    renderCatPicker(panel);
    renderSessionTally(panel);
    var card = currentCard();
    if (!card){
      showEmpty(panel);
      return;
    }
    var cat = CATS[card.cat];
    var html = '<div class="fcard" id="fcard">';
    html += '<span class="tag '+cat.cls+'">'+cat.label+'</span>';
    html += '<div class="front-word">'+card.en+'<button class="spk" id="spkBtn" title="Произношение">🔊</button></div>';
    if (state.flipped){
      html += '<div class="example">'+card.ex+'</div>';
      html += '<div class="back"><div class="ru">'+card.ru+'</div><div class="example">'+card.exRu+'</div></div>';
    } else {
      html += '<div class="hint">Нажмите на карточку, чтобы увидеть перевод</div>';
    }
    html += '</div>';
    if (state.flipped){
      html += '<div class="grade-row">'+
        '<button class="no" id="gradeNo">Не вспомнила</button>'+
        '<button class="yes" id="gradeYes">Вспомнила</button>'+
        '</div>';
    }
    panel.innerHTML += html;

    document.getElementById('fcard').addEventListener('click', function(e){
      if (e.target.id === 'spkBtn') return;
      state.flipped = !state.flipped;
      render();
    });
    var spk = document.getElementById('spkBtn');
    if (spk) spk.addEventListener('click', function(ev){ ev.stopPropagation(); speak(card.en); });
    var yes = document.getElementById('gradeYes');
    var no = document.getElementById('gradeNo');
    if (yes) yes.addEventListener('click', function(){ grade(card.id, true, 'flash'); renderTallies(); advance(); });
    if (no) no.addEventListener('click', function(){ grade(card.id, false, 'flash'); renderTallies(); advance(); });
  }

  /* ---------------- RENDER: QUIZ ---------------- */
  function buildQuizOptions(card){
    var sameCat = DECK.filter(function(d){ return d.cat === card.cat && d.id !== card.id; });
    var pool = sameCat.length >= 3 ? sameCat : DECK.filter(function(d){ return d.id !== card.id; });
    var distractors = shuffle(pool).slice(0,3);
    var direction = Math.random() < 0.5 ? 'en2ru' : 'ru2en';
    var options = distractors.concat([card]);
    options = shuffle(options);
    return {direction:direction, options:options};
  }

  var quizCache = {};

  function renderQuiz(panel){
    renderCatPicker(panel);
    renderSessionTally(panel);
    var card = currentCard();
    if (!card){
      showEmpty(panel);
      return;
    }
    if (!quizCache[card.id] || quizCache.forId !== card.id){
      quizCache = buildQuizOptions(card);
      quizCache.forId = card.id;
    }
    var isEn2Ru = quizCache.direction === 'en2ru';
    var promptText = isEn2Ru ? card.en : card.ru;
    var html = '<div class="q-prompt"><div class="lbl">'+(isEn2Ru ? 'Что это значит?' : 'Как сказать по-английски?')+'</div>';
    html += '<div class="word">'+promptText;
    if (isEn2Ru) html += '<button class="spk" id="spkBtnQ" title="Произношение">🔊</button>';
    html += '</div></div>';
    html += '<div class="options">';
    quizCache.options.forEach(function(opt, i){
      var label = isEn2Ru ? opt.ru : opt.en;
      html += '<button class="opt" data-i="'+i+'">'+label+'</button>';
    });
    html += '</div><div id="quizFeedback"></div>';
    panel.innerHTML += html;

    var spk = document.getElementById('spkBtnQ');
    if (spk) spk.addEventListener('click', function(){ speak(card.en); });

    var buttons = panel.querySelectorAll('.opt');
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        if (state.quizAnswered) return;
        state.quizAnswered = true;
        var chosen = quizCache.options[parseInt(btn.getAttribute('data-i'),10)];
        var correct = chosen.id === card.id;
        buttons.forEach(function(b){
          var opt = quizCache.options[parseInt(b.getAttribute('data-i'),10)];
          if (opt.id === card.id) b.classList.add('correct');
          else if (b === btn) b.classList.add('wrong');
        });
        grade(card.id, correct, 'quiz');
        renderTallies();
        var fb = document.getElementById('quizFeedback');
        fb.innerHTML = '<div class="feedback '+(correct?'ok':'bad')+'">'+
          (correct ? 'Верно.' : 'Правильный ответ: '+ (isEn2Ru ? card.ru : card.en)) +
          '<span class="ex">'+card.ex+' — '+card.exRu+'</span></div>'+
          '<button class="next-btn" id="nextBtn">Дальше</button>';
        document.getElementById('nextBtn').addEventListener('click', advance);
      });
    });
  }

  /* ---------------- RENDER: TYPE ---------------- */
  // Lenient comparison: ignores case, apostrophes, hyphens, punctuation and a leading "to".
  function normalizeAnswer(s){
    return s.toLowerCase().trim()
      .replace(/^to\s+/,'')
      .replace(/['’]/g,'')
      .replace(/[-–—]/g,' ')
      .replace(/[^a-z0-9\s]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }

  function renderType(panel){
    renderCatPicker(panel);
    renderSessionTally(panel);
    var card = currentCard();
    if (!card){
      showEmpty(panel);
      return;
    }
    var html = '<div class="q-prompt"><div class="lbl">Напишите фразу по-английски</div>';
    html += '<div class="word">'+card.ru+'</div></div>';
    html += '<div class="type-row"><input type="text" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here..." '+(state.typeChecked?'disabled':'')+'>';
    html += '<button id="checkBtn">'+(state.typeChecked?'Ок':'Проверить')+'</button></div>';
    html += '<div id="typeFeedback"></div>';
    panel.innerHTML += html;

    var input = document.getElementById('typeInput');
    input.focus();

    function doCheck(){
      if (state.typeChecked) { advance(); return; }
      state.typeChecked = true;
      var val = normalizeAnswer(input.value || '');
      var target = normalizeAnswer(card.en);
      var correct = val.length > 0 && val === target;
      grade(card.id, correct, 'type');
      renderTallies();
      var fb = document.getElementById('typeFeedback');
      fb.innerHTML = '<div class="feedback '+(correct?'ok':'bad')+'">'+
        (correct ? 'Верно: '+card.en : 'Правильный ответ: '+card.en) +
        '<span class="ex">'+card.ex+' — '+card.exRu+'</span></div>'+
        '<button class="next-btn" id="nextBtn">Дальше</button>';
      document.getElementById('checkBtn').style.display='none';
      document.getElementById('nextBtn').addEventListener('click', advance);
      input.disabled = true;
    }
    document.getElementById('checkBtn').addEventListener('click', doCheck);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') doCheck();
    });
  }

  /* ---------------- RENDER: BUILD A SENTENCE ---------------- */
  var buildState = {forId:null, tokens:[], order:[], placed:[], checked:false, correct:false};

  function startBuild(card){
    var toks = card.ex.split(/\s+/).filter(Boolean);
    var idxs = toks.map(function(_, i){ return i; });
    var order = shuffle(idxs), tries = 0;
    // don't hand over the sentence already in the right order
    while (toks.length > 2 && order.join() === idxs.join() && tries < 10){ order = shuffle(idxs); tries++; }
    buildState = {forId:card.id, tokens:toks, order:order, placed:[], checked:false, correct:false};
  }

  function renderBuild(panel){
    renderCatPicker(panel);
    renderSessionTally(panel);
    var card = currentCard();
    if (!card){
      showEmpty(panel);
      return;
    }
    if (buildState.forId !== card.id) startBuild(card);
    var b = buildState;
    var html = '<div class="q-prompt"><div class="lbl">Соберите предложение по-английски</div>'+
      '<div class="word" style="font-size:1.15rem;line-height:1.35">'+card.exRu+'</div>'+
      '<div class="note">Во фразе: <b>'+card.en+'</b> — '+card.ru+'</div></div>';
    html += '<div class="answer-zone" id="answerZone">';
    b.placed.forEach(function(ti, pos){
      html += '<button class="chip placed" data-pos="'+pos+'">'+b.tokens[ti]+'</button>';
    });
    html += '</div>';
    html += '<div class="token-pool">';
    b.order.forEach(function(ti){
      var used = b.placed.indexOf(ti) > -1;
      html += '<button class="chip'+(used?' used':'')+'" data-tok="'+ti+'">'+b.tokens[ti]+'</button>';
    });
    html += '</div>';
    if (!b.checked){
      html += '<div class="btn-row"><button class="btn-ghost" id="buildReset">Сначала</button>'+
        '<button class="btn-solid" id="buildCheck" '+(b.placed.length === b.tokens.length ? '' : 'disabled')+'>Проверить</button></div>';
    } else {
      html += '<div class="feedback '+(b.correct?'ok':'bad')+'">'+
        (b.correct ? 'Верно!' : 'Правильный порядок:')+
        '<span class="ex" style="font-style:normal;color:inherit;font-weight:600">'+card.ex+'</span></div>'+
        '<div class="btn-row" style="margin-top:12px"><button class="btn-ghost" id="buildSpeak">🔊 Послушать</button>'+
        '<button class="btn-solid" id="nextBtn">Дальше</button></div>';
    }
    panel.innerHTML += html;

    panel.querySelectorAll('.chip[data-tok]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (b.checked) return;
        var ti = parseInt(btn.getAttribute('data-tok'), 10);
        if (b.placed.indexOf(ti) === -1){ b.placed.push(ti); render(); }
      });
    });
    panel.querySelectorAll('.chip[data-pos]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (b.checked) return;
        b.placed.splice(parseInt(btn.getAttribute('data-pos'), 10), 1);
        render();
      });
    });
    var rs = document.getElementById('buildReset');
    if (rs) rs.addEventListener('click', function(){ b.placed = []; render(); });
    var ck = document.getElementById('buildCheck');
    if (ck) ck.addEventListener('click', function(){
      if (b.placed.length !== b.tokens.length) return;
      b.correct = b.placed.map(function(ti){ return b.tokens[ti]; }).join(' ') === b.tokens.join(' ');
      b.checked = true;
      grade(card.id, b.correct, 'build');
      render();
    });
    var sp = document.getElementById('buildSpeak');
    if (sp) sp.addEventListener('click', function(){ speak(card.ex); });
    var nx = document.getElementById('nextBtn');
    if (nx) nx.addEventListener('click', advance);
  }

  /* ---------------- RENDER: LISTEN ---------------- */
  var lastSpokenId = null;

  function renderListen(panel){
    renderCatPicker(panel);
    renderSessionTally(panel);
    var card = currentCard();
    if (!card){
      showEmpty(panel);
      return;
    }
    var canSpeak = ('speechSynthesis' in window);
    var html = '<div class="q-prompt"><div class="lbl">'+
      (canSpeak ? 'Послушайте и напишите по-английски то, что услышали' : 'Напишите по-английски (озвучки на этом устройстве нет)')+'</div>';
    if (canSpeak){
      html += '<button class="listen-btn" id="playBtn" title="Прослушать">🔊</button>'+
              '<button class="listen-slow" id="slowBtn">медленнее</button>';
    } else {
      html += '<div class="word">'+card.ru+'</div>';
    }
    html += '</div>';
    html += '<div class="type-row"><input type="text" id="listenInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type what you hear..." '+(state.typeChecked?'disabled':'')+'>';
    html += '<button id="listenCheck">'+(state.typeChecked?'Ок':'Проверить')+'</button></div>';
    html += '<div id="listenFeedback"></div>';
    panel.innerHTML += html;

    var play = document.getElementById('playBtn');
    if (play) play.addEventListener('click', function(){ speak(card.en); });
    var slow = document.getElementById('slowBtn');
    if (slow) slow.addEventListener('click', function(){ speak(card.en, 0.6); });
    if (canSpeak && lastSpokenId !== card.id){
      lastSpokenId = card.id;
      setTimeout(function(){ speak(card.en); }, 250);
    }

    var input = document.getElementById('listenInput');
    input.focus();
    function doCheck(){
      if (state.typeChecked){ advance(); return; }
      state.typeChecked = true;
      var correct = normalizeAnswer(input.value || '').length > 0 &&
                    normalizeAnswer(input.value || '') === normalizeAnswer(card.en);
      grade(card.id, correct, 'listen');
      renderTallies();
      document.getElementById('listenFeedback').innerHTML =
        '<div class="feedback '+(correct?'ok':'bad')+'">'+
        (correct ? 'Верно: ' : 'Правильно так: ')+card.en+' — '+card.ru+
        '<span class="ex">'+card.ex+' — '+card.exRu+'</span></div>'+
        '<button class="next-btn" id="nextBtn">Дальше</button>';
      document.getElementById('listenCheck').style.display = 'none';
      document.getElementById('nextBtn').addEventListener('click', advance);
      input.disabled = true;
    }
    document.getElementById('listenCheck').addEventListener('click', doCheck);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') doCheck(); });
  }

  /* ---------------- RENDER: DAYS (history + backup) ---------------- */
  var WEEKDAYS = ['вс','пн','вт','ср','чт','пт','сб'];

  function lastDays(n){
    var out = [];
    for (var i = 0; i < n; i++){
      var d = new Date();
      d.setDate(d.getDate() - i);
      var key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      var dd = ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2);
      out.push({key:key, label:WEEKDAYS[d.getDay()]+' '+dd});
    }
    return out;
  }

  function exportCode(){
    return btoa(unescape(encodeURIComponent(JSON.stringify(PROGRESS))));
  }
  function importCode(str){
    var obj = JSON.parse(decodeURIComponent(escape(atob(String(str).replace(/\s+/g,'')))));
    if (!obj || typeof obj.cards !== 'object') throw new Error('bad');
    if (!obj.streak) obj.streak = {count:0, lastDate:null};
    if (!obj.history) obj.history = {};
    if (!obj.today) obj.today = freshToday(obj.cards);
    return obj;
  }

  function renderDays(panel){
    var days = lastDays(14);
    var hist = PROGRESS.history || {};
    var maxReps = 1;
    days.forEach(function(d){ var h = hist[d.key]; if (h && h.reps > maxReps) maxReps = h.reps; });

    var started = DECK.filter(function(d){ return ensureCardState(d.id).seen > 0; }).length;
    var mastered = DECK.filter(function(d){ return isMastered(d.id); }).length;
    var html = '<div class="sec-title">Последние 14 дней</div>';
    days.forEach(function(d){
      var h = hist[d.key];
      var reps = h ? h.reps : 0;
      var pct = h && h.reps ? Math.round(100 * h.correct / h.reps) : 0;
      html += '<div class="day-row"><span>'+d.label+'</span>'+
        '<div class="bar-wrap">'+(reps ? '<div class="bar" style="width:'+Math.round(100 * reps / maxReps)+'%"></div>' : '')+'</div>'+
        (reps ? '<div class="meta">'+reps+' '+plural(reps, ['повторение','повторения','повторений'])+
                ' · новых слов: '+h.newWords+' · верно '+pct+'%</div>' : '')+'</div>';
    });

    html += '<div class="sec-title" style="margin-top:18px">По темам</div>';
    html += '<div class="note" style="margin-top:-4px">Серая полоса — слова, с которыми уже начали, зелёная — усвоенные.</div>';
    Object.keys(CATS).forEach(function(key){
      var all = DECK.filter(function(d){ return d.cat === key; });
      var s = all.filter(function(d){ return ensureCardState(d.id).seen > 0; }).length;
      var m = all.filter(function(d){ return isMastered(d.id); }).length;
      html += '<div class="cat-prog"><div class="line"><span>'+CATS[key].label+'</span><span>начато '+s+' · усвоено '+m+' из '+all.length+'</span></div>'+
        '<div class="track"><div class="seen" style="width:'+Math.round(100 * s / all.length)+'%"></div>'+
        '<div class="mast" style="width:'+Math.round(100 * m / all.length)+'%"></div></div></div>';
    });
    html += '<div class="note"><b>Всего:</b> начато '+started+' из '+DECK.length+', усвоено '+mastered+'.</div>';

    html += '<div class="sec-title" style="margin-top:18px">Перенос прогресса</div>'+
      '<div class="note">Чтобы продолжить на другом устройстве, скопируйте код ниже, откройте тренажёр там, вставьте код в это поле и нажмите «Загрузить».</div>'+
      '<textarea class="code" id="codeBox" spellcheck="false"></textarea>'+
      '<div class="btn-row" style="margin-top:8px"><button class="btn-ghost" id="copyCode">Скопировать код</button>'+
      '<button class="btn-solid" id="loadCode">Загрузить код</button></div>'+
      '<div class="note" id="codeMsg"></div>';
    panel.innerHTML += html;

    var box = document.getElementById('codeBox');
    box.value = exportCode();
    var msg = document.getElementById('codeMsg');
    document.getElementById('copyCode').addEventListener('click', function(){
      box.value = exportCode();
      function fallback(){ box.select(); try{ document.execCommand('copy'); msg.textContent = 'Код скопирован.'; }catch(e){ msg.textContent = 'Выделите код в поле и скопируйте вручную.'; } }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(box.value).then(function(){ msg.textContent = 'Код скопирован.'; }, fallback);
      } else { fallback(); }
    });
    document.getElementById('loadCode').addEventListener('click', function(){
      var obj;
      try{ obj = importCode(box.value); }catch(e){ msg.textContent = 'Не удалось прочитать код. Проверьте, что он вставлен целиком.'; return; }
      if (!confirm('Заменить текущий прогресс на загруженный?')) return;
      PROGRESS = obj;
      saveProgress(PROGRESS);
      buildQueue();
      render();
    });
  }

  /* ---------------- RENDER: BROWSE ---------------- */
  function renderBrowse(panel){
    renderCatPicker(panel);
    var pool = DECK_RAW.filter(function(d){ return state.activeCats.indexOf(d.cat) > -1; });
    var html = '<div class="browse-list">';
    pool.forEach(function(d){
      html += '<div class="browse-item"><div><span class="en">'+d.en+'</span><br><span style="font-size:0.78rem;color:var(--ink-soft)">'+d.ex+'</span></div>'+
        '<div class="ru">'+d.ru+'<br><span style="font-size:0.78rem">'+d.exRu+'</span></div></div>';
    });
    html += '</div>';
    panel.innerHTML += html;
  }

  /* ---------------- MAIN RENDER ---------------- */
  function render(){
    renderTallies();
    var panel = document.getElementById('panel');
    panel.innerHTML = '';
    if (state.mode === 'flash') renderFlash(panel);
    else if (state.mode === 'quiz') renderQuiz(panel);
    else if (state.mode === 'type') renderType(panel);
    else if (state.mode === 'build') renderBuild(panel);
    else if (state.mode === 'listen') renderListen(panel);
    else if (state.mode === 'days') renderDays(panel);
    else if (state.mode === 'browse') renderBrowse(panel);

    panel.querySelectorAll('[data-cat]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var cat = btn.getAttribute('data-cat');
        var idx = state.activeCats.indexOf(cat);
        if (idx > -1){
          if (state.activeCats.length > 1) state.activeCats.splice(idx,1);
        } else {
          state.activeCats.push(cat);
        }
        buildQueue();
        render();
      });
    });
  }

  /* ---------------- NAV ---------------- */
  document.getElementById('modeNav').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    document.querySelectorAll('#modeNav button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.mode = btn.getAttribute('data-mode');
    state.flipped = false;
    state.quizAnswered = false;
    state.typeChecked = false;
    state.idx = 0;
    buildQueue();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('Сбросить весь прогресс изучения? Это действие нельзя отменить.')) return;
    PROGRESS = defaultProgress();
    saveProgress(PROGRESS);
    buildQueue();
    render();
  });

  /* ---------------- INIT ---------------- */
  loadProgress().then(function(p){
    PROGRESS = p;
    if (!PROGRESS.cards) PROGRESS = defaultProgress();
    if (!PROGRESS.streak) PROGRESS.streak = {count:0, lastDate:null};
    if (!PROGRESS.history) PROGRESS.history = {};
    renderBanner();
    buildQueue();
    render();
  });

})();
</script>
</body>
</html>
